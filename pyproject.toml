[project]
name = "cubesat-swarm"
version = "0.1.0"
description = "Self-healing 6-CubeSat swarm: failure detection, replanning, and coverage recovery under Hill-Clohessy-Wiltshire dynamics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.1",
    "pydantic>=2.9",
    "scipy>=1.14",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubesat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
# cubesat.hcw does not exist until G1, so ruff's resolution-based first-party
# detection misses it; pin the package so import order is stable.
known-first-party = ["cubesat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
markers = [
    "slow: long-running checks (Kepler cross-check, byte-determinism hash); excluded from the fast loop",
]
