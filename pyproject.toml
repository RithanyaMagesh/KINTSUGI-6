[project]
name = "cubesat-swarm"
version = "0.1.0"
description = "Self-healing 6-CubeSat swarm: failure detection, replanning, and coverage recovery under Hill-Clohessy-Wiltshire dynamics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "lightgbm>=4.7.0",
    "numpy>=2.1",
    "pydantic>=2.9",
    "scipy>=1.14",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubesat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
# cubesat.hcw does not exist until G1, so ruff's resolution-based first-party
# detection misses it; pin the package so import order is stable.
known-first-party = ["cubesat"]

[tool.ruff.lint.per-file-ignores]
# Frozen user bundle (files/INTEGRATION_PROMPT.md Phase 0): the pipeline is
# sha256-sealed by out2/test_manifest.json, so these files must stay byte-exact --
# lint is waived wholesale and the seal tests are the quality gate.
"files/**" = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p: the fast-test gate can strip the quoting from the documented fast loop
# (`uv run pytest -m "not slow" -x -q`, AGENTS.md), leaving a stray `slow`
# path arg that fails collection; cubesat._pytest_gate_fix repairs exactly
# that malformed shape and is inert for every well-formed invocation.
addopts = "-q --basetemp=.pytest_tmp -p cubesat._pytest_gate_fix"
markers = [
    "slow: long-running checks (Kepler cross-check, byte-determinism hash); excluded from the fast loop",
]
